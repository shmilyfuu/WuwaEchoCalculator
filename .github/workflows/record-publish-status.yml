name: Record v1.3.2 publish status

on:
  workflow_run:
    workflows: [ "Publish v1.3.2" ]
    types: [ completed ]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout status branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record workflow result
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > PUBLISH_STATUS_V132.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "conclusion": "${CONCLUSION}",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PUBLISH_STATUS_V132.json
          git commit -m "ci: record v1.3.2 publication ${CONCLUSION}" || exit 0
          git push origin HEAD:release-status/v1.3.2 --force
