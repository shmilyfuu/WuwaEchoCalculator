name: Build UI screenshot preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate_icon.py

      - name: Install ONNX Runtime SDK
        shell: pwsh
        run: nuget install Microsoft.ML.OnnxRuntime -OutputDirectory packages -ExcludeVersion -NonInteractive

      - name: Compile UI preview executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $native = Resolve-Path native
          $out = Join-Path $PWD ui-preview
          $ort = Resolve-Path packages\Microsoft.ML.OnnxRuntime
          $ortInclude = Join-Path $ort 'build\native\include'
          $ortNative = Join-Path $ort 'runtimes\win-x64\native'
          New-Item -ItemType Directory -Force $out | Out-Null
          $batch = @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          cd /d "$native"
          rc.exe /nologo /fo "$out\app.res" app.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc /DWUWA_UI_PREVIEW /I"$ortInclude" build_entry.cpp ocr_build_entry.cpp ocr_parser.cpp update_manager.cpp "$out\app.res" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /OUT:"$out\WuwaEchoUiPreview.exe" /LIBPATH:"$ortNative" onnxruntime.lib d2d1.lib dwrite.lib windowscodecs.lib comdlg32.lib shell32.lib ole32.lib dwmapi.lib user32.lib gdi32.lib uuid.lib winhttp.lib bcrypt.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc /DWUWA_UI_PREVIEW updater_main.cpp "$out\app.res" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /OUT:"$out\WuwaEchoUpdaterUiPreview.exe" shell32.lib dwmapi.lib user32.lib gdi32.lib
          if errorlevel 1 exit /b 1
          mt.exe -nologo -manifest app.manifest -outputresource:"$out\WuwaEchoUiPreview.exe";#1
          if errorlevel 1 exit /b 1
          mt.exe -nologo -manifest app.manifest -outputresource:"$out\WuwaEchoUpdaterUiPreview.exe";#1
          if errorlevel 1 exit /b 1
          "@
          Set-Content ui-preview.cmd $batch -Encoding ASCII
          cmd.exe /d /c ui-preview.cmd
          if ($LASTEXITCODE -ne 0) { throw "UI preview build failed with exit code $LASTEXITCODE" }
          Copy-Item "$ortNative\*.dll" $out -Force

      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-ui-screenshot-preview
          path: ui-preview
          if-no-files-found: error
          retention-days: 3
