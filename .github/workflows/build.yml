name: Build Windows portable app

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate_icon.py

      - name: Assemble application script
        shell: pwsh
        run: |
          Get-Content 'web\app.part1.js','web\app.part2.js','web\app.part3.js' | Set-Content 'web\app.js' -Encoding UTF8

      - name: Download official PaddleOCR ONNX models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'public\models\stage'
          $det = Join-Path $stage 'PP-OCRv5_mobile_det_onnx_infer'
          $rec = Join-Path $stage 'PP-OCRv5_mobile_rec_onnx_infer'
          New-Item -ItemType Directory -Force $det, $rec | Out-Null
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/main/inference.onnx?download=true' -o "$det\inference.onnx"
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/main/inference.yml?download=true' -o "$det\inference.yml"
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_rec_onnx/resolve/main/inference.onnx?download=true' -o "$rec\inference.onnx"
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_rec_onnx/resolve/main/inference.yml?download=true' -o "$rec\inference.yml"
          Push-Location $stage
          tar.exe -cf '..\PP-OCRv5_mobile_det_onnx_infer.tar' 'PP-OCRv5_mobile_det_onnx_infer'
          tar.exe -cf '..\PP-OCRv5_mobile_rec_onnx_infer.tar' 'PP-OCRv5_mobile_rec_onnx_infer'
          Pop-Location
          Remove-Item $stage -Recurse -Force

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          npm config set registry https://registry.npmjs.org
          npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Install WebView2 SDK
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion -NonInteractive

      - name: Compile native WebView2 host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $sdk = Resolve-Path 'packages\Microsoft.Web.WebView2'
          $include = Join-Path $sdk 'build\native\include'
          $lib = Join-Path $sdk 'build\native\x64'
          $native = Resolve-Path 'native'
          $out = Join-Path $PWD 'build-native'
          New-Item -ItemType Directory -Force $out | Out-Null
          $cmd = @"
          call "$vcvars"
          cd /d "$native"
          rc.exe /nologo /fo "$out\app.res" app.rc
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE /I"$include" app.cpp "$out\app.res" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /OUT:"$out\WuwaEchoCalculator.exe" /LIBPATH:"$lib" WebView2LoaderStatic.lib user32.lib gdi32.lib shell32.lib ole32.lib oleaut32.lib shlwapi.lib dwmapi.lib advapi32.lib version.lib runtimeobject.lib
          mt.exe -nologo -manifest app.manifest -outputresource:"$out\WuwaEchoCalculator.exe";#1
          "@
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Native build failed with exit code $LASTEXITCODE" }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $folder = 'artifact\鸣潮声骸计算器_v1.2.0'
          New-Item -ItemType Directory -Force "$folder\web", "$folder\data" | Out-Null
          Copy-Item 'dist-web\*' "$folder\web" -Recurse -Force
          Copy-Item 'dist-web\index.html' "$folder\web\panel.html" -Force
          Copy-Item 'build-native\WuwaEchoCalculator.exe' "$folder\鸣潮声骸计算器.exe"
          @'
          鸣潮声骸计算器 v1.2.0

          1. 完整解压压缩包，保留 web 与 data 目录。
          2. 双击“鸣潮声骸计算器.exe”。
          3. 可拖入图片、点击上传或按 Ctrl+V 粘贴截图。
          4. 识别期间可点击“停止识别”终止当前任务。
          5. 核对五条辅音属性与档位，选择声骸 1—5 后确认记录。
          6. 五件全部记录后，可导出包含五张声骸卡片的 PNG 图片。

          最终平均分 = 五件声骸小计之和 ÷ 5。
          截图和识别数据均在本机处理。
          '@ | Set-Content "$folder\使用说明.txt" -Encoding UTF8
          @'
          v1.2.0
          - 五件声骸卡片固定显示在同一屏。
          - 新增停止识别与记录图导出。
          - 置信度改为绿、黄、红三色圆点。
          - 移除预测分与方案显示。
          - 新增应用图标并调整按钮文字布局。
          '@ | Set-Content "$folder\更新说明.txt" -Encoding UTF8
          @'
          版本：1.2.0
          窗口：WebView2 独立应用
          计分：五件声骸小计相加 ÷ 5
          OCR：PP-OCRv5 本地模型
          最小窗口：1400 × 860
          '@ | Set-Content "$folder\版本信息.txt" -Encoding UTF8

      - name: Validate package
        shell: pwsh
        run: |
          $folder = 'artifact\鸣潮声骸计算器_v1.2.0'
          $required = @(
            "$folder\鸣潮声骸计算器.exe",
            "$folder\web\panel.html",
            "$folder\web\ocr-sandbox.html",
            "$folder\web\models\PP-OCRv5_mobile_det_onnx_infer.tar",
            "$folder\web\models\PP-OCRv5_mobile_rec_onnx_infer.tar",
            "$folder\web\assets\app-icon.png"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing: $path" } }
          if (-not (Get-ChildItem "$folder\web\assets" -Filter '*.wasm' -File)) { throw 'WASM runtime missing' }
          Get-Item "$folder\鸣潮声骸计算器.exe" | Format-List Name,Length,VersionInfo

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path 'artifact\鸣潮声骸计算器_v1.2.0' -DestinationPath 'artifact\鸣潮声骸计算器_WebView2独立版_v1.2.0.zip' -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-echo-calculator-v1.2.0
          path: artifact/鸣潮声骸计算器_WebView2独立版_v1.2.0.zip
          if-no-files-found: error
          retention-days: 7
