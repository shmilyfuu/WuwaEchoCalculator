name: Build Windows native Direct2D preview

on:
  push:
    branches: [ feature/native-direct2d-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare generated sources, icon and fixtures
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow pyyaml
          python scripts/generate_icon.py
          python scripts/patch_native_ui.py
          python scripts/patch_native_ocr.py
          python scripts/patch_ocr_engine.py
          python scripts/patch_ocr_engine_main_parity.py
          python scripts/patch_native_runtime_fixes.py
          python scripts/patch_native_export_figma.py
          python scripts/patch_native_v130_ui.py
          python scripts/patch_native_v130_ocr.py
          python scripts/patch_native_v130_update.py
          python scripts/patch_update_manager.py
          python scripts/patch_updater_main.py
          python scripts/generate_ocr_smoke_image.py

      - name: Install ONNX Runtime SDK
        shell: pwsh
        run: nuget install Microsoft.ML.OnnxRuntime -OutputDirectory packages -ExcludeVersion -NonInteractive

      - name: Download PP-OCRv5 models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $models = Join-Path $PWD 'build-models'
          New-Item -ItemType Directory -Force $models | Out-Null
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/main/inference.onnx?download=true' -o "$models\det.onnx"
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_rec_onnx/resolve/main/inference.onnx?download=true' -o "$models\rec.onnx"
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_rec_onnx/resolve/main/inference.yml?download=true' -o "$models\rec.yml"
          python scripts/extract_ocr_dict.py "$models\rec.yml" "$models\dict.txt"

      - name: Compile native application, updater and smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $native = Resolve-Path 'native'
          $out = Join-Path $PWD 'build-native'
          $ort = Resolve-Path 'packages\Microsoft.ML.OnnxRuntime'
          $ortInclude = Join-Path $ort 'build\native\include'
          $ortNative = Join-Path $ort 'runtimes\win-x64\native'
          New-Item -ItemType Directory -Force $out | Out-Null
          $batch = @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          cd /d "$native"
          rc.exe /nologo /fo "$out\app.res" app.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc /I"$ortInclude" build_entry.cpp ocr_build_entry.cpp ocr_parser.cpp update_manager_fixed.cpp "$out\app.res" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /OUT:"$out\WuwaEchoCalculatorNative.exe" /LIBPATH:"$ortNative" onnxruntime.lib d2d1.lib dwrite.lib windowscodecs.lib comdlg32.lib shell32.lib ole32.lib dwmapi.lib user32.lib gdi32.lib uuid.lib winhttp.lib bcrypt.lib
          if errorlevel 1 exit /b 1
          mt.exe -nologo -manifest app.manifest -outputresource:"$out\WuwaEchoCalculatorNative.exe";#1
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc updater_main_fixed.cpp "$out\app.res" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /OUT:"$out\WuwaEchoUpdater.exe" shell32.lib dwmapi.lib user32.lib gdi32.lib
          if errorlevel 1 exit /b 1
          mt.exe -nologo -manifest app.manifest -outputresource:"$out\WuwaEchoUpdater.exe";#1
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc /I"$ortInclude" ocr_smoke_test.cpp ocr_build_entry.cpp /link /SUBSYSTEM:CONSOLE /OUT:"$out\ocr_smoke_test.exe" /LIBPATH:"$ortNative" onnxruntime.lib windowscodecs.lib ole32.lib user32.lib gdi32.lib uuid.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc ocr_parser_smoke_test.cpp ocr_parser.cpp /link /SUBSYSTEM:CONSOLE /OUT:"$out\ocr_parser_smoke_test.exe"
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc update_manager_smoke_test.cpp update_manager_fixed.cpp /link /SUBSYSTEM:CONSOLE /OUT:"$out\update_manager_smoke_test.exe" winhttp.lib bcrypt.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc png_export_smoke_test.cpp /link /SUBSYSTEM:CONSOLE /OUT:"$out\png_export_smoke_test.exe" d2d1.lib windowscodecs.lib ole32.lib user32.lib gdi32.lib uuid.lib
          if errorlevel 1 exit /b 1
          "@
          Set-Content 'build-native.cmd' $batch -Encoding ASCII
          cmd.exe /d /c build-native.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$out\WuwaEchoCalculatorNative.exe")) { throw 'Native EXE was not created' }
          if (-not (Test-Path "$out\WuwaEchoUpdater.exe")) { throw 'Updater EXE was not created' }
          Copy-Item "$ortNative\*.dll" $out -Force

      - name: Run native regression tests
        shell: pwsh
        run: |
          & 'build-native\ocr_parser_smoke_test.exe'
          if ($LASTEXITCODE -ne 0) { throw "OCR parser smoke test failed with exit code $LASTEXITCODE" }
          & 'build-native\update_manager_smoke_test.exe'
          if ($LASTEXITCODE -ne 0) { throw "Updater smoke test failed with exit code $LASTEXITCODE" }

      - name: Run PP-OCRv5 smoke test
        shell: pwsh
        run: |
          $models = Resolve-Path 'build-models'
          $image = Resolve-Path 'build-tests\ocr_smoke.png'
          & 'build-native\ocr_smoke_test.exe' $models $image
          if ($LASTEXITCODE -ne 0) { throw "OCR smoke test failed with exit code $LASTEXITCODE" }

      - name: Run PNG export smoke test and validate generated source
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'build-tests\png_export_smoke.png'
          & 'build-native\png_export_smoke_test.exe' $output
          if ($LASTEXITCODE -ne 0) { throw "PNG export smoke test failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $output)) { throw 'PNG smoke output was not created' }
          if ((Get-Item $output).Length -lt 1024) { throw 'PNG smoke output is unexpectedly small' }
          if (-not (Test-Path 'native\app_v130_update.cpp')) { throw 'v1.3.0 generated source missing' }
          $generated = Get-Content 'native\app_v130_update.cpp' -Raw
          if ($generated.Contains('L"v1.3.0-native"')) { throw 'Preview version suffix remains in generated source' }
          if (-not $generated.Contains('CreateEmbeddedBitmap(rt.Get(),EmbeddedIcons::kStar)')) { throw 'Export star bitmap is not target-local' }
          if (-not $generated.Contains('SelectMainCompatibleOcrRows')) { throw 'Main-compatible OCR parser is not connected' }
          if (-not $generated.Contains('NativeUpdateManager updateManager_')) { throw 'Native updater is not connected' }
          if (-not $generated.Contains('DrawUpdateModal')) { throw 'Update progress dialog is missing' }

      - name: Assemble preview package
        shell: pwsh
        run: |
          $folder = 'artifact\鸣潮声骸计算器_v1.3.0_原生预览'
          New-Item -ItemType Directory -Force "$folder\models", "$folder\data", "$folder\updates" | Out-Null
          Copy-Item 'build-native\WuwaEchoCalculatorNative.exe' "$folder\鸣潮声骸计算器.exe"
          Copy-Item 'build-native\WuwaEchoUpdater.exe' "$folder\WuwaEchoUpdater.exe"
          Copy-Item 'packages\Microsoft.ML.OnnxRuntime\runtimes\win-x64\native\*.dll' $folder -Force
          Copy-Item 'build-models\det.onnx','build-models\rec.onnx','build-models\dict.txt' "$folder\models" -Force
          @'
          鸣潮声骸计算器 v1.3.0 原生迁移预览

          - 使用 Win32、Direct2D、DirectWrite、WIC 与 ONNX Runtime。
          - 主界面与导出图片按最新设计稿坐标校准。
          - OCR 图片预处理、属性匹配、严格档位误差和五行选择规则向 main 对齐。
          - 记录成功后自动选择下一个空声骸位置。
          - 导出标题输入框仅在获得焦点时显示底部高亮条。
          - 更新检查优先 Gitee，失败后使用 GitHub；支持下载、校验和安装进度。
          - 当前包仍属于迁移分支测试产物。

          请保留 models 目录、WuwaEchoUpdater.exe 和 ONNX Runtime DLL，不要单独移动主程序。
          '@ | Set-Content "$folder\原生迁移说明.txt" -Encoding UTF8
          Compress-Archive -Path $folder -DestinationPath 'artifact\鸣潮声骸计算器_v1.3.0_原生预览.zip' -CompressionLevel Optimal
          Copy-Item 'artifact\鸣潮声骸计算器_v1.3.0_原生预览.zip' 'artifact\WuwaEchoCalculator-v1.3.0-windows-x64.zip'
          $hash = (Get-FileHash 'artifact\WuwaEchoCalculator-v1.3.0-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WuwaEchoCalculator-v1.3.0-windows-x64.zip" | Set-Content 'artifact\WuwaEchoCalculator-v1.3.0-windows-x64.zip.sha256' -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-echo-calculator-v1.3.0-native-preview
          path: |
            artifact/鸣潮声骸计算器_v1.3.0_原生预览.zip
            artifact/WuwaEchoCalculator-v1.3.0-windows-x64.zip
            artifact/WuwaEchoCalculator-v1.3.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
