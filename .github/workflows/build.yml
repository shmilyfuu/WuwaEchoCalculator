name: Build Windows native Direct2D preview

on:
  push:
    branches: [ feature/native-direct2d-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate_icon.py

      - name: Compile native Direct2D application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $native = Resolve-Path 'native'
          $out = Join-Path $PWD 'build-native'
          New-Item -ItemType Directory -Force $out | Out-Null
          $batch = @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          cd /d "$native"
          rc.exe /nologo /fo "$out\app.res" app.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE app.cpp "$out\app.res" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /OUT:"$out\WuwaEchoCalculatorNative.exe" d2d1.lib dwrite.lib windowscodecs.lib comdlg32.lib shell32.lib ole32.lib dwmapi.lib user32.lib gdi32.lib uuid.lib
          if errorlevel 1 exit /b 1
          mt.exe -nologo -manifest app.manifest -outputresource:"$out\WuwaEchoCalculatorNative.exe";#1
          if errorlevel 1 exit /b 1
          "@
          Set-Content 'build-native.cmd' $batch -Encoding ASCII
          cmd.exe /d /c build-native.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$out\WuwaEchoCalculatorNative.exe")) { throw 'Native EXE was not created' }

      - name: Assemble preview package
        shell: pwsh
        run: |
          $folder = 'artifact\鸣潮声骸计算器_Direct2D原生预览'
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item 'build-native\WuwaEchoCalculatorNative.exe' "$folder\鸣潮声骸计算器_原生预览.exe"
          @'
          鸣潮声骸计算器 Direct2D 原生迁移预览

          已完成：
          - WebView2 客户区替换为 Win32 + Direct2D + DirectWrite。
          - 固定 1188 × 772 布局。
          - 图片点击导入、文件拖入、Ctrl+V 粘贴。
          - 手动选择属性和档位、计分、记录、编辑、删除、清空。
          - 五件声骸全部记录后启用“导出记录”。
          - 导出标题使用 Direct2D 假输入框叠加透明 Win32 EDIT。
          - PNG 记录图由 WIC 与 Direct2D 原生生成。
          - 按钮保持普通箭头光标，并加入 hover、按下颜色和 1px 下压反馈。

          暂未完成：
          - PP-OCRv5 原生 ONNX Runtime 推理与识别结果解析。
          - 记录和设置的本地持久化。
          - 最终逐像素视觉校准与完整键盘操作。

          这是迁移验证包，请勿替换正式版。
          '@ | Set-Content "$folder\原生迁移说明.txt" -Encoding UTF8
          Compress-Archive -Path $folder -DestinationPath 'artifact\鸣潮声骸计算器_Direct2D原生预览.zip' -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-echo-calculator-native-direct2d-preview
          path: artifact/鸣潮声骸计算器_Direct2D原生预览.zip
          if-no-files-found: error
          retention-days: 7
