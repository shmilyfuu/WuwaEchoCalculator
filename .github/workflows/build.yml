name: Build Windows native Direct2D preview

on:
  push:
    branches: [ feature/native-direct2d-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate_icon.py

      - name: Generate corrected native source
        shell: pwsh
        run: python scripts/patch_native_ui.py

      - name: Compile native Direct2D application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $native = Resolve-Path 'native'
          $out = Join-Path $PWD 'build-native'
          New-Item -ItemType Directory -Force $out | Out-Null
          $batch = @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          cd /d "$native"
          rc.exe /nologo /fo "$out\app.res" app.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc build_entry.cpp "$out\app.res" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /OUT:"$out\WuwaEchoCalculatorNative.exe" d2d1.lib dwrite.lib windowscodecs.lib comdlg32.lib shell32.lib ole32.lib dwmapi.lib user32.lib gdi32.lib uuid.lib
          if errorlevel 1 exit /b 1
          mt.exe -nologo -manifest app.manifest -outputresource:"$out\WuwaEchoCalculatorNative.exe";#1
          if errorlevel 1 exit /b 1
          "@
          Set-Content 'build-native.cmd' $batch -Encoding ASCII
          cmd.exe /d /c build-native.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$out\WuwaEchoCalculatorNative.exe")) { throw 'Native EXE was not created' }

      - name: Assemble preview package
        shell: pwsh
        run: |
          $folder = 'artifact\鸣潮声骸计算器_Direct2D原生预览'
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item 'build-native\WuwaEchoCalculatorNative.exe' "$folder\鸣潮声骸计算器_原生预览.exe"
          @'
          鸣潮声骸计算器 Direct2D 原生迁移预览

          本次修正：
          - 使用正式版下拉箭头、词条星形和识别状态图标。
          - 校正当前统计文字、数值和按钮的位置。
          - 修正置顶开关显示位置与点击区域。
          - 弹窗上下区域改为无重叠拼接，确认按钮统一使用蓝色。
          - 导出标题输入框改为深色真实输入层叠加 Direct2D 外观。
          - 恢复“请输入标题（可选）”占位提示，长度提示常驻显示。

          已有功能：
          - 图片点击导入、文件拖入、Ctrl+V 粘贴。
          - 手动选择属性和档位、计分、记录、编辑、删除、清空。
          - 五件声骸全部记录后启用“导出记录”。
          - PNG 记录图由 WIC 与 Direct2D 原生生成。

          当前 OCR 原生推理仍在接入阶段。
          这是迁移验证包，请勿替换正式版。
          '@ | Set-Content "$folder\原生迁移说明.txt" -Encoding UTF8
          Compress-Archive -Path $folder -DestinationPath 'artifact\鸣潮声骸计算器_Direct2D原生预览.zip' -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-echo-calculator-native-direct2d-preview
          path: artifact/鸣潮声骸计算器_Direct2D原生预览.zip
          if-no-files-found: error
          retention-days: 7
