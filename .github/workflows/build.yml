name: Build Windows native Direct2D preview

on:
  push:
    branches: [ feature/native-direct2d-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare generated sources, icon and OCR fixture
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow pyyaml
          python scripts/generate_icon.py
          python scripts/patch_native_ui.py
          python scripts/patch_native_ocr.py
          python scripts/patch_ocr_engine.py
          python scripts/patch_native_runtime_fixes.py
          python scripts/patch_native_export_figma.py
          python scripts/generate_ocr_smoke_image.py

      - name: Install ONNX Runtime SDK
        shell: pwsh
        run: nuget install Microsoft.ML.OnnxRuntime -OutputDirectory packages -ExcludeVersion -NonInteractive

      - name: Download PP-OCRv5 models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $models = Join-Path $PWD 'build-models'
          New-Item -ItemType Directory -Force $models | Out-Null
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/main/inference.onnx?download=true' -o "$models\det.onnx"
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_rec_onnx/resolve/main/inference.onnx?download=true' -o "$models\rec.onnx"
          curl.exe -L --fail --retry 4 --retry-delay 3 'https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_rec_onnx/resolve/main/inference.yml?download=true' -o "$models\rec.yml"
          python scripts/extract_ocr_dict.py "$models\rec.yml" "$models\dict.txt"

      - name: Compile native application and smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $native = Resolve-Path 'native'
          $out = Join-Path $PWD 'build-native'
          $ort = Resolve-Path 'packages\Microsoft.ML.OnnxRuntime'
          $ortInclude = Join-Path $ort 'build\native\include'
          $ortNative = Join-Path $ort 'runtimes\win-x64\native'
          New-Item -ItemType Directory -Force $out | Out-Null
          $batch = @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          cd /d "$native"
          rc.exe /nologo /fo "$out\app.res" app.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc /I"$ortInclude" build_entry.cpp ocr_build_entry.cpp "$out\app.res" /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /OUT:"$out\WuwaEchoCalculatorNative.exe" /LIBPATH:"$ortNative" onnxruntime.lib d2d1.lib dwrite.lib windowscodecs.lib comdlg32.lib shell32.lib ole32.lib dwmapi.lib user32.lib gdi32.lib uuid.lib
          if errorlevel 1 exit /b 1
          mt.exe -nologo -manifest app.manifest -outputresource:"$out\WuwaEchoCalculatorNative.exe";#1
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc /I"$ortInclude" ocr_smoke_test.cpp ocr_build_entry.cpp /link /SUBSYSTEM:CONSOLE /OUT:"$out\ocr_smoke_test.exe" /LIBPATH:"$ortNative" onnxruntime.lib windowscodecs.lib ole32.lib user32.lib gdi32.lib uuid.lib
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /std:c++17 /O2 /EHsc png_export_smoke_test.cpp /link /SUBSYSTEM:CONSOLE /OUT:"$out\png_export_smoke_test.exe" d2d1.lib windowscodecs.lib ole32.lib user32.lib gdi32.lib uuid.lib
          if errorlevel 1 exit /b 1
          "@
          Set-Content 'build-native.cmd' $batch -Encoding ASCII
          cmd.exe /d /c build-native.cmd
          if ($LASTEXITCODE -ne 0) { throw "Native build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$out\WuwaEchoCalculatorNative.exe")) { throw 'Native EXE was not created' }
          Copy-Item "$ortNative\*.dll" $out -Force

      - name: Run PP-OCRv5 smoke test
        shell: pwsh
        run: |
          $models = Resolve-Path 'build-models'
          $image = Resolve-Path 'build-tests\ocr_smoke.png'
          & 'build-native\ocr_smoke_test.exe' $models $image
          if ($LASTEXITCODE -ne 0) { throw "OCR smoke test failed with exit code $LASTEXITCODE" }

      - name: Run PNG export smoke test
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'build-tests\png_export_smoke.png'
          & 'build-native\png_export_smoke_test.exe' $output
          if ($LASTEXITCODE -ne 0) { throw "PNG export smoke test failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $output)) { throw 'PNG smoke output was not created' }
          if ((Get-Item $output).Length -lt 1024) { throw 'PNG smoke output is unexpectedly small' }
          $generated = Get-Content 'native\app_release.cpp' -Raw
          if ($generated.Contains('DrawIcon(rt,iconStar_.Get(),Rect(x+18,ry+7,11,11));')) { throw 'Export renderer still references a window-target bitmap' }

      - name: Assemble preview package
        shell: pwsh
        run: |
          $folder = 'artifact\鸣潮声骸计算器_Direct2D原生OCR预览'
          New-Item -ItemType Directory -Force "$folder\models" | Out-Null
          Copy-Item 'build-native\WuwaEchoCalculatorNative.exe' "$folder\鸣潮声骸计算器_原生OCR预览.exe"
          Copy-Item 'packages\Microsoft.ML.OnnxRuntime\runtimes\win-x64\native\*.dll' $folder -Force
          Copy-Item 'build-models\det.onnx','build-models\rec.onnx','build-models\dict.txt' "$folder\models" -Force
          @'
          鸣潮声骸计算器 Direct2D 原生 OCR 预览

          本次修正：
          - 导出绘制不再跨绘制目标复用窗口图标位图。
          - 导出弹窗按照 Figma 的 384×198 布局重新校准。
          - 输入框采用 336×32 外观，真实输入区限定在内部文字区域。
          - 长度提示仅在标题超过 12 个字符时显示，恢复到限制内后立即隐藏。
          - 导出绘制失败时显示 Direct2D HRESULT。
          - 保留 PP-OCRv5 推理和 WIC PNG 落盘自测。

          已有功能：
          - 使用 PP-OCRv5 检测与识别 ONNX 模型在本机处理图片。
          - 导入、拖入或粘贴图片后自动识别。
          - 支持停止识别与重新识别。
          - 识别结果会自动匹配声骸属性与档位，仍需人工核对。

          请保留 models 目录和 ONNX Runtime DLL，不要单独移动 EXE。
          '@ | Set-Content "$folder\原生迁移说明.txt" -Encoding UTF8
          Compress-Archive -Path $folder -DestinationPath 'artifact\鸣潮声骸计算器_Direct2D原生OCR预览.zip' -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-echo-calculator-native-direct2d-ocr-preview
          path: artifact/鸣潮声骸计算器_Direct2D原生OCR预览.zip
          if-no-files-found: error
          retention-days: 7
